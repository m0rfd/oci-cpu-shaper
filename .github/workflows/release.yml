name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Publish ${{ matrix.image_tag }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: nonroot
            image_tag: nonroot
            tag_suffix: ""
            include_latest: true
          - target: rootful
            image_tag: rootful
            tag_suffix: ",suffix=-rootful"
            include_latest: false
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: oci-cpu-shaper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Log in to registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build metadata
        id: buildmeta
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - name: Compose tag manifest
        id: tagset
        shell: bash
        run: |
          {
            echo 'tags<<EOF'
            echo "type=raw,value=${{ matrix.image_tag }}"
            if [[ "${{ matrix.include_latest }}" == "true" ]]; then
              echo "type=raw,value=latest"
            fi
            echo "type=ref,event=tag${{ matrix.tag_suffix }}"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.tagset.outputs.tags }}

      - name: Build and push multi-arch image (${{ matrix.image_tag }})
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}

      - name: Sign container image (${{ matrix.image_tag }})
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_ref="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          signature_file="cosign-${{ github.ref_name }}-${{ matrix.image_tag }}.sig"
          certificate_file="cosign-${{ github.ref_name }}-${{ matrix.image_tag }}.pem"

          cosign sign \
            --keyless \
            --output-signature "$signature_file" \
            --output-certificate "$certificate_file" \
            "$image_ref"

      - name: Generate SBOM attestation (${{ matrix.image_tag }})
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_ref="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          predicate="sbom-${{ github.ref_name }}-${{ matrix.image_tag }}.spdx.json"
          attestation_file="sbom-attestation-${{ github.ref_name }}-${{ matrix.image_tag }}.jsonl"
          attestation_signature="sbom-attestation-${{ github.ref_name }}-${{ matrix.image_tag }}.sig"
          attestation_certificate="sbom-attestation-${{ github.ref_name }}-${{ matrix.image_tag }}.pem"

          cosign attest \
            --keyless \
            --predicate "$predicate" \
            --type spdx \
            --output-attestation "$attestation_file" \
            --output-signature "$attestation_signature" \
            --output-certificate "$attestation_certificate" \
            "$image_ref"

      - name: Generate SBOM (${{ matrix.image_tag }})
        id: sbom
        uses: anchore/sbom-action@v0.20.9
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}
          output-file: sbom-${{ github.ref_name }}-${{ matrix.image_tag }}.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact (${{ matrix.image_tag }})
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ github.ref_name }}-${{ matrix.image_tag }}
          path: sbom-${{ github.ref_name }}-${{ matrix.image_tag }}.spdx.json
          retention-days: 7

      - name: Upload signing assets to release (${{ matrix.image_tag }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            cosign-${{ github.ref_name }}-${{ matrix.image_tag }}.sig
            cosign-${{ github.ref_name }}-${{ matrix.image_tag }}.pem
            sbom-attestation-${{ github.ref_name }}-${{ matrix.image_tag }}.jsonl
            sbom-attestation-${{ github.ref_name }}-${{ matrix.image_tag }}.sig
            sbom-attestation-${{ github.ref_name }}-${{ matrix.image_tag }}.pem
