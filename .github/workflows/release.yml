name: Docker CI & Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Branch, tag, or SHA to release"
        default: "main"
        required: true
        type: string
      dry_run:
        description: "Run release pipeline without pushing images or signing"
        default: true
        required: true
        type: boolean
  pull_request:
    branches: [main]
  pull_request_target:
    types: [labeled]
    branches: [main]
  merge_group:
  push:
    tags:
      - "v*" # release on v* tags (assumed from main)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SHELLCHECK_VERSION: "0.10.0"
  PYFLAKES_VERSION: "3.2.0"
  ACTIONLINT_VERSION: "v1.7.9"

defaults:
  run:
    shell: bash

# ---------------------------
# Job 1: PR build & test only
# ---------------------------

jobs:
  verify-tag:
    name: Verify tag (lint, test, coverage)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOBIN: ${{ github.workspace }}/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record golangci-lint version
        run: echo "GOLANGCI_LINT_VERSION=$(make -s print-golangci-lint-version)" >>"$GITHUB_ENV"

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Cache golangci-lint workspace
        uses: actions/cache@v4
        with:
          path: .cache/golangci
          key: ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache golangci-lint binary
        uses: actions/cache@v4
        with:
          path: ${{ env.GOBIN }}/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-golangci-${{ env.GOLANGCI_LINT_VERSION }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-golangci-${{ env.GOLANGCI_LINT_VERSION }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Set up lint tools
        uses: ./.github/actions/setup-lint-tools

      - name: Cache actionlint binary
        uses: actions/cache@v4
        with:
          path: ${{ env.GOBIN }}/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-${{ env.ACTIONLINT_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-actionlint-${{ env.ACTIONLINT_VERSION }}-

      - name: Locate CI workflow run for this commit
        id: locate-ci-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          run_id=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            --field per_page=50 \
            --field event=push \
            --jq "(.workflow_runs[] | select(.head_sha==\"${GITHUB_SHA}\") | .id)" \
            | head -n 1)

          if [ -z "$run_id" ]; then
            echo "No CI workflow run found for commit ${GITHUB_SHA}; skipping integration coverage reuse"
            exit 0
          fi

          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download CI lint/test logs (if available)
        id: download-make-check-logs
        if: steps.locate-ci-run.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.locate-ci-run.outputs.run-id }}
          name: make-check-logs
          path: artifacts

      - name: Check lint/test artifact availability
        id: lint-test-availability
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          if [ "${{ steps.download-make-check-logs.outcome || '' }}" = "success" ] && [ -f artifacts/make-check.log ]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lint (fallback)
        if: steps.lint-test-availability.outputs.available == '0'
        run: |
          set -o pipefail
          mkdir -p artifacts
          make lint 2>&1 | tee artifacts/make-lint.log
        env:
          GOBIN: ${{ env.GOBIN }}

      - name: Upload lint logs
        if: always() && steps.lint-test-availability.outputs.available == '0'
        uses: actions/upload-artifact@v5
        with:
          name: lint-logs
          path: artifacts/make-lint.log

      - name: Run actionlint for release workflow (fallback)
        if: steps.lint-test-availability.outputs.available == '0'
        run: |
          set -o pipefail
          mkdir -p artifacts
          make actionlint ACTIONLINT_PATHS=".github/workflows/release.yml" 2>&1 | tee artifacts/release-actionlint.log
        env:
          GOBIN: ${{ env.GOBIN }}

      - name: Upload actionlint logs
        if: always() && steps.lint-test-availability.outputs.available == '0'
        uses: actions/upload-artifact@v5
        with:
          name: actionlint-logs-release
          path: artifacts/release-actionlint.log

      - name: Check Makefile formatting (fallback)
        if: steps.lint-test-availability.outputs.available == '0'
        run: make lint-makefile

      - name: Run tests (fallback)
        if: steps.lint-test-availability.outputs.available == '0'
        run: make test

      - name: Download integration coverage (if available)
        id: download-integration-coverage
        if: steps.locate-ci-run.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.locate-ci-run.outputs.run-id }}
          name: integration-coverage
          path: artifacts

      - name: Check integration coverage availability
        id: integration-coverage-availability
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          if [ "${{ steps.download-integration-coverage.outcome || '' }}" = "success" ] && [ -f artifacts/integration-coverage.out ]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CI coverage report (if available)
        id: download-coverage-report
        if: steps.locate-ci-run.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.locate-ci-run.outputs.run-id }}
          name: coverage-report
          path: artifacts

      - name: Check coverage artifact availability
        id: coverage-availability
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          if [ "${{ steps.download-coverage-report.outcome || '' }}" = "success" ] && [ -f artifacts/coverage.out ] && [ -f artifacts/coverage.txt ]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish reused coverage summary
        if: steps.coverage-availability.outputs.available == '1'
        run: |
          { echo '### Coverage results (reused artifact)'; echo; cat artifacts/coverage.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Run coverage
        if: steps.coverage-availability.outputs.available == '0'
        env:
          MIN_COVERAGE: "96"
          COVERAGE_PROFILE: coverage.out
          COVERAGE_SUMMARY: coverage.txt
          REUSE_INTEGRATION_COVERAGE: ${{ steps.integration-coverage-availability.outputs.available || '0' }}
          INTEGRATION_COVERAGE_PROFILE: artifacts/integration-coverage.out
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          integration_available="${REUSE_INTEGRATION_COVERAGE:-0}"

          coverage_env=(
            "MIN_COVERAGE=$MIN_COVERAGE"
            "COVERAGE_PROFILE=$COVERAGE_PROFILE"
            "COVERAGE_SUMMARY=$COVERAGE_SUMMARY"
            "REUSE_INTEGRATION_COVERAGE=$integration_available"
            "INTEGRATION_COVERAGE_PROFILE=$INTEGRATION_COVERAGE_PROFILE"
          )

          env "${coverage_env[@]}" make coverage

  build-and-test-pr:
    name: Build & test (pull_request, no publish)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write

    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Restore Go build and module caches
        id: restore-go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run checks before container build
        run: make check

      - name: Save Go build and module caches
        if: github.event.pull_request.head_repo.fork == false && steps.restore-go-cache.outputs.cache-hit != 'true' && github.ref_protected == true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ steps.restore-go-cache.outputs.cache-primary-key }}

      - name: Compute build metadata
        id: build_meta
        run: |
          echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          commit_date=$(git show -s --format=%cI "${GITHUB_SHA}" || true)
          echo "build_date=${commit_date:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (optional, for consistency)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # For PRs we just build a local single-arch image and load it
      - name: Build rootless image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: rootless
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build,mode=max
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          tags: pr-local/${{ github.repository }}:${{ github.sha }}

      # basic container smoke test
      - name: Smoke test container
        run: |
          output=$(docker run --rm pr-local/${{ github.repository }}:${{ github.sha }} --version)

          expected=$(printf '{Version:%s GitCommit:%s BuildDate:%s}' \
            "${{ steps.build_meta.outputs.version }}" \
            "${{ github.sha }}" \
            "${{ steps.build_meta.outputs.build_date }}")

          if [[ "${output}" != "${expected}" ]]; then
            echo "version output mismatch"
            echo "  got:      ${output}"
            echo "  expected: ${expected}"
            exit 1
          fi

      # Trivy scan on PR (local image) + SARIF upload
      - name: Scan PR image with Trivy (SARIF)
        id: trivy_scan_pr
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: pr-local/${{ github.repository }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results-pr.sarif"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF (PR)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-pr.sarif
          category: trivy-pr-rootless

      - name: Fail PR if Trivy found CRITICAL/HIGH vulns
        if: steps.trivy_scan_pr.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL/HIGH vulnerabilities in PR image."
          exit 1

  build-and-test-merge-group:
    name: Build & test (merge_group, no publish)
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      security-events: write

    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Restore Go build and module caches
        id: restore-go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run checks before container build
        run: make check

      - name: Save Go build and module caches
        if: steps.restore-go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ steps.restore-go-cache.outputs.cache-primary-key }}

      - name: Compute build metadata
        id: build_meta
        run: |
          echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          commit_date=$(git show -s --format=%cI "${GITHUB_SHA}" || true)
          echo "build_date=${commit_date:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (optional, for consistency)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # For merge queue we just build a local single-arch image and load it
      - name: Build rootless image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: rootless
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build,mode=max
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          tags: pr-local/${{ github.repository }}:${{ github.sha }}

      # basic container smoke test
      - name: Smoke test container
        run: |
          output=$(docker run --rm pr-local/${{ github.repository }}:${{ github.sha }} --version)

          expected=$(printf '{Version:%s GitCommit:%s BuildDate:%s}' \
            "${{ steps.build_meta.outputs.version }}" \
            "${{ github.sha }}" \
            "${{ steps.build_meta.outputs.build_date }}")

          if [[ "${output}" != "${expected}" ]]; then
            echo "version output mismatch"
            echo "  got:      ${output}"
            echo "  expected: ${expected}"
            exit 1
          fi

      # Trivy scan on merge queue image (local image, no SARIF upload)
      - name: Scan merge queue image with Trivy
        id: trivy_scan_merge_group
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: pr-local/${{ github.repository }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results-merge-group.sarif"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Fail merge queue run if Trivy found CRITICAL/HIGH vulns
        if: steps.trivy_scan_merge_group.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL/HIGH vulnerabilities in merge queue image."
          exit 1

  # --------------------------------
  # Job 2: Release orchestration (tag + dry-run)
  # --------------------------------
  dispatch-release-dry-run:
    name: Dispatch release dry-run from label
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'release-dry-run'
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger dry-run workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          gh workflow run release.yml \
            --ref "${PR_HEAD_SHA}" \
            -f release_ref="${PR_HEAD_SHA}" \
            -f dry_run=true

  release-tagged:
    name: Release multi-arch images (tagged)
    needs: verify-tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: write # artifacts (upload)
      packages: write # GHCR push (release job)
      id-token: write # Cosign keyless (release job)
      security-events: write # Trivy SARIF upload
    uses: ./.github/workflows/release-runner.yml
    with:
      release_ref: ${{ github.ref }}
      release_tag: ${{ github.ref_name }}
      publish_images: true
      sign_artifacts: true
      target_platforms: linux/amd64,linux/arm64
      load_image: false
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
  release-dispatch:
    name: Release multi-arch images (dispatch)
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    permissions:
      contents: read
      actions: write # artifacts (upload)
      security-events: write # artifact/SARIF handling
    uses: ./.github/workflows/release-runner.yml
    with:
      release_ref: ${{ inputs.release_ref }}
      release_tag: ""
      publish_images: false
      sign_artifacts: false
      target_platforms: linux/amd64
      load_image: true
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
