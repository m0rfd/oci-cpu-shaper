name: Docker CI & Release

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SHELLCHECK_VERSION: "0.10.0"
  PYFLAKES_VERSION: "3.2.0"
  ACTIONLINT_VERSION: "v1.7.9"

defaults:
  run:
    shell: bash

# ---------------------------
# Job 1: PR build & test only
# ---------------------------

jobs:
  verify-tag:
    name: Verify tag (lint, test, coverage)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
    outputs:
      release-ref: ${{ steps.release-info.outputs.release-ref }}
      release-ref-name: ${{ steps.release-info.outputs.release-ref-name }}
      release-sha: ${{ steps.release-info.outputs.release-sha }}
      use-ci-artifacts: ${{ steps.ci-artifacts.outputs.available || '0' }}
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOBIN: ${{ github.workspace }}/bin

    steps:
      - name: Resolve tag context
        id: release-info
        env:
          RELEASE_REF_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          RELEASE_REF: ${{ github.event_name == 'workflow_run' && format('refs/tags/{0}', github.event.workflow_run.head_branch) || github.ref }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "release-ref=${RELEASE_REF}" >> "$GITHUB_OUTPUT"
          echo "release-ref-name=${RELEASE_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "release-sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download CI coverage artifact (if available)
        id: download-ci-coverage
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: coverage-report
          path: artifacts/ci

      - name: Determine CI artifact availability
        id: ci-artifacts
        run: |
          if [ -f artifacts/ci/coverage.out ] && [ -f artifacts/ci/coverage.txt ]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-info.outputs.release-ref }}

      - name: Record golangci-lint version
        if: steps.ci-artifacts.outputs.available != '1'
        run: echo "GOLANGCI_LINT_VERSION=$(make -s print-golangci-lint-version)" >>"$GITHUB_ENV"

      - name: Set up Go with cache
        id: setup-go
        if: steps.ci-artifacts.outputs.available != '1'
        uses: ./.github/actions/setup-go-with-cache

      - name: Cache golangci-lint workspace
        uses: actions/cache@v4
        if: steps.ci-artifacts.outputs.available != '1'
        with:
          path: .cache/golangci
          key: ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache golangci-lint binary
        uses: actions/cache@v4
        if: steps.ci-artifacts.outputs.available != '1'
        with:
          path: ${{ env.GOBIN }}/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Set up lint tools
        if: steps.ci-artifacts.outputs.available != '1'
        uses: ./.github/actions/setup-lint-tools

      - name: Cache actionlint binary
        uses: actions/cache@v4
        if: steps.ci-artifacts.outputs.available != '1'
        with:
          path: ${{ env.GOBIN }}/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-${{ env.ACTIONLINT_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-actionlint-${{ env.ACTIONLINT_VERSION }}-

      - name: Run lint
        if: steps.ci-artifacts.outputs.available != '1'
        run: make lint
        env:
          GOBIN: ${{ env.GOBIN }}

      - name: Run actionlint for release workflow
        if: steps.ci-artifacts.outputs.available != '1'
        run: make actionlint ACTIONLINT_PATHS=".github/workflows/release.yml"
        env:
          GOBIN: ${{ env.GOBIN }}

      - name: Check Makefile formatting
        if: steps.ci-artifacts.outputs.available != '1'
        run: make lint-makefile

      - name: Run tests
        if: steps.ci-artifacts.outputs.available != '1'
        run: make test

      - name: Download integration coverage (if available)
        id: download-integration-coverage
        continue-on-error: true
        if: steps.ci-artifacts.outputs.available != '1'
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: ci.yml
          commit: ${{ steps.release-info.outputs.release-sha }}
          name: integration-coverage
          path: artifacts

      - name: Check integration coverage availability
        id: integration-coverage-availability
        if: steps.ci-artifacts.outputs.available != '1'
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          if [ "${{ steps.download-integration-coverage.outcome || '' }}" = "success" ] && [ -f artifacts/integration-coverage.out ]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run coverage
        if: steps.ci-artifacts.outputs.available != '1'
        env:
          MIN_COVERAGE: "96"
          COVERAGE_PROFILE: coverage.out
          COVERAGE_SUMMARY: coverage.txt
          REUSE_INTEGRATION_COVERAGE: ${{ steps.integration-coverage-availability.outputs.available || '0' }}
          INTEGRATION_COVERAGE_PROFILE: artifacts/integration-coverage.out
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          integration_available="${REUSE_INTEGRATION_COVERAGE:-0}"

          coverage_env=(
            "MIN_COVERAGE=$MIN_COVERAGE"
            "COVERAGE_PROFILE=$COVERAGE_PROFILE"
            "COVERAGE_SUMMARY=$COVERAGE_SUMMARY"
            "REUSE_INTEGRATION_COVERAGE=$integration_available"
            "INTEGRATION_COVERAGE_PROFILE=$INTEGRATION_COVERAGE_PROFILE"
          )

            env "${coverage_env[@]}" make coverage

      - name: Reuse CI coverage results
        if: steps.ci-artifacts.outputs.available == '1'
        run: |
          echo "CI coverage artifacts already validated for tag ${{ steps.release-info.outputs.release-ref-name }}." >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: Build & test (PR / merge_group, no publish)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      security-events: write

    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Run checks before container build
        run: make check

      - name: Compute build metadata
        id: build_meta
        run: |
          echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          commit_date=$(git show -s --format=%cI "${GITHUB_SHA}" || true)
          echo "build_date=${commit_date:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (optional, for consistency)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # For PRs we just build a local single-arch image and load it
      - name: Build rootless image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: rootless
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build,mode=max
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          tags: pr-local/${{ github.repository }}:${{ github.sha }}

      # basic container smoke test
      - name: Smoke test container
        run: |
          output=$(docker run --rm pr-local/${{ github.repository }}:${{ github.sha }} --version)

          expected=$(printf '{Version:%s GitCommit:%s BuildDate:%s}' \
            "${{ steps.build_meta.outputs.version }}" \
            "${{ github.sha }}" \
            "${{ steps.build_meta.outputs.build_date }}")

          if [[ "${output}" != "${expected}" ]]; then
            echo "version output mismatch"
            echo "  got:      ${output}"
            echo "  expected: ${expected}"
            exit 1
          fi

      # Trivy scan on PR (local image) + SARIF upload
      - name: Scan PR image with Trivy (SARIF)
        id: trivy_scan_pr
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: pr-local/${{ github.repository }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results-pr.sarif"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF (PR)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-pr.sarif
          category: trivy-pr-rootless

      - name: Fail PR if Trivy found CRITICAL/HIGH vulns
        if: steps.trivy_scan_pr.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL/HIGH vulnerabilities in PR image."
          exit 1

  # --------------------------------
  # Job 2: Release on v* tag (GHCR)
  # --------------------------------

  release:
    name: Release multi-arch images (tagged)
    runs-on: ubuntu-latest
    needs: verify-tag
    if: needs.verify-tag.result == 'success' && startsWith(needs.verify-tag.outputs.release-ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write # GHCR push (release job)
      id-token: write # Cosign keyless (release job)
      security-events: write # Trivy SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-tag.outputs.release-ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For convenience, strip 'v' from tag if you ever need bare version
      - name: Extract version
        id: vars
        run: |
          VERSION="${{ needs.verify-tag.outputs.release-ref-name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata
        id: build_meta
        run: |
          commit_date=$(git show -s --format=%cI "${{ needs.verify-tag.outputs.release-sha }}" || true)
          echo "build_date=${commit_date:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}" >> "$GITHUB_OUTPUT"

      # ------ Metadata (tags + labels) with docker/metadata-action ------
      # Rootless is the primary image (gets :latest + semver tags)
      - name: Docker meta (rootless)
        id: meta_rootless
        uses: docker/metadata-action@v5
        env:
          GITHUB_REF: ${{ needs.verify-tag.outputs.release-ref }}
          GITHUB_REF_NAME: ${{ needs.verify-tag.outputs.release-ref-name }}
          GITHUB_SHA: ${{ needs.verify-tag.outputs.release-sha }}
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag                               # v1.2.3
            type=ref,event=tag,suffix=-rootless              # v1.2.3-rootless
            type=semver,pattern={{version}}                  # 1.2.3
            type=semver,pattern={{version}},suffix=-rootless # 1.2.3-rootless
            type=semver,pattern={{major}}                    # 1
            type=semver,pattern={{major}},suffix=-rootless   # 1-rootless
            type=semver,pattern=v{{major}}                   # v1
            type=semver,pattern=v{{major}},suffix=-rootless  # v1-rootless
            type=raw,value=rootless                          # rootless
          flavor: |
            latest=true                                      # also tag :latest
            labels: |
              org.opencontainers.image.title=${{ github.repository }}
              org.opencontainers.image.source=${{ github.repositoryUrl }}
              org.opencontainers.image.revision=${{ needs.verify-tag.outputs.release-sha }}
              org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      # Rootful variant – tags prefixed with rootful-
      - name: Docker meta (rootful)
        id: meta_rootful
        uses: docker/metadata-action@v5
        env:
          GITHUB_REF: ${{ needs.verify-tag.outputs.release-ref }}
          GITHUB_REF_NAME: ${{ needs.verify-tag.outputs.release-ref-name }}
          GITHUB_SHA: ${{ needs.verify-tag.outputs.release-sha }}
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag               # v1.2.3-rootful
            type=semver,pattern={{version}}  # 1.2.3-rootful
            type=semver,pattern={{major}}    # 1-rootful
            type=semver,pattern=v{{major}}   # v1-rootful
            type=raw,value=rootful,suffix=   # rootful
          flavor: |
            latest=false                     # auto by default; latest is for rootless only
            suffix=-rootful,onlatest=true    # add -rootful to each tag
            labels: |
              org.opencontainers.image.title=${{ github.repository }} (rootful)
              org.opencontainers.image.source=${{ github.repositoryUrl }}
              org.opencontainers.image.revision=${{ needs.verify-tag.outputs.release-sha }}
              org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      # ------ Build & push rootless (multi-arch, with cache, SBOM, provenance) ------

      - name: Build and push rootless image (multi-arch)
        id: build_rootless
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: rootless
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_rootless.outputs.tags }}
          labels: ${{ steps.meta_rootless.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            GIT_COMMIT=${{ needs.verify-tag.outputs.release-sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            IMAGE_SOURCE=${{ github.repositoryUrl }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-builder
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-builder,mode=max

      # ------ Build & push rootful (multi-arch) ------

      - name: Build and push rootful image (multi-arch)
        id: build_rootful
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: rootful
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_rootful.outputs.tags }}
          labels: ${{ steps.meta_rootful.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            GIT_COMMIT=${{ needs.verify-tag.outputs.release-sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            IMAGE_SOURCE=${{ github.repositoryUrl }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-builder
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-builder,mode=max

      # ------ Cosign signing (keyless) ------
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0
        with:
          # Keep cosign pinned for predictable signing output; bump docs when upgrading.
          cosign-release: 'v3.0.2'

      - name: Sign rootless image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST="${{ steps.build_rootless.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

          echo "Signing ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"

      - name: Sign rootful image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST="${{ steps.build_rootful.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

          echo "Signing ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"

      # ------ Trivy image scan + SARIF upload (rootless tag) ------

      - name: Scan rootless image with Trivy (SARIF)
        id: trivy_scan_rootless
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify-tag.outputs.release-ref-name }}
          format: "sarif"
          output: "trivy-results-rootless.sarif"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1" # non-zero when CRITICAL/HIGH found

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-rootless.sarif
          category: trivy-rootless

      - name: Fail release if Trivy found CRITICAL/HIGH vulnerabilities
        if: steps.trivy_scan_rootless.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL/HIGH vulnerabilities in the rootless image."
          exit 1

      # ------ Explicit SBOM artifact (on top of SBOM attestation) ------

      - name: Generate SBOM (SPDX JSON) for rootless
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify-tag.outputs.release-ref-name }}
          format: "spdx-json"
          output: "sbom-rootless.spdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        with:
          name: sbom-rootless-${{ needs.verify-tag.outputs.release-ref-name }}
          path: sbom-rootless.spdx.json

      - name: Generate SBOM (SPDX JSON) for rootful
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify-tag.outputs.release-ref-name }}-rootful
          format: "spdx-json"
          output: "sbom-rootful.spdx.json"

      - name: Upload SBOM artifact for rootful
        uses: actions/upload-artifact@v5
        with:
          name: sbom-rootful-${{ needs.verify-tag.outputs.release-ref-name }}
          path: sbom-rootful.spdx.json
