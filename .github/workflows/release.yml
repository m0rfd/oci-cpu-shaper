name: Docker CI & Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_type || (startsWith(github.ref, 'refs/tags/') && 'tag') || (github.ref && 'branch') || (github.event.workflow_run && (startsWith(github.event.workflow_run.ref, 'refs/tags/') && 'tag' || 'branch')) || 'unknown' }}-${{ github.ref || (github.event.workflow_run && github.event.workflow_run.ref) || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SHELLCHECK_VERSION: "0.10.0"
  PYFLAKES_VERSION: "3.2.0"
  ACTIONLINT_VERSION: "v1.7.9"

defaults:
  run:
    shell: bash

# ---------------------------
# Job 1: PR build & test only
# ---------------------------

jobs:
  verify-tag:
    name: Verify tag (lint, test, coverage)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # needed to download CI artifacts and publish logs
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOBIN: ${{ github.workspace }}/bin
      CI_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download coverage from CI workflow
        id: download-ci-coverage
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CI_RUN_ID }}
          name: coverage-report
          path: artifacts/ci

      - name: Download integration coverage from CI workflow
        id: download-ci-integration-coverage
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CI_RUN_ID }}
          name: integration-coverage
          path: artifacts/ci

      - name: Locate CI artifacts
        id: ci-artifacts
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          coverage_out=$(find artifacts/ci -name 'coverage.out' -print -quit || true)
          coverage_txt=$(find artifacts/ci -name 'coverage.txt' -print -quit || true)
          integration_coverage=$(find artifacts/ci -name 'integration-coverage.out' -print -quit || true)

          coverage_available=0
          integration_available=0

          if [ -n "${coverage_out}" ] && [ -n "${coverage_txt}" ]; then
            coverage_available=1
            cp "${coverage_out}" coverage.out
            cp "${coverage_txt}" coverage.txt
          fi

          if [ -n "${integration_coverage}" ]; then
            integration_available=1
          fi

          {
            echo "coverage-available=${coverage_available}"
            echo "integration-available=${integration_available}"
            echo "integration-profile=${integration_coverage}"
          } >>"$GITHUB_OUTPUT"

      - name: Record golangci-lint version
        if: steps.ci-artifacts.outputs.coverage-available != '1'
        run: echo "GOLANGCI_LINT_VERSION=$(make -s print-golangci-lint-version)" >>"$GITHUB_ENV"

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Cache golangci-lint workspace
        if: steps.ci-artifacts.outputs.coverage-available != '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/cache@v5
        with:
          path: .cache/golangci
          key: ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache golangci-lint binary
        if: steps.ci-artifacts.outputs.coverage-available != '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/cache@v5
        with:
          path: ${{ env.GOBIN }}/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-golangci-${{ env.GOLANGCI_LINT_VERSION }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-golangci-${{ env.GOLANGCI_LINT_VERSION }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Set up lint tools
        if: steps.ci-artifacts.outputs.coverage-available != '1'
        uses: ./.github/actions/setup-lint-tools

      - name: Cache actionlint binary
        if: steps.ci-artifacts.outputs.coverage-available != '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/cache@v5
        with:
          path: ${{ env.GOBIN }}/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-${{ env.ACTIONLINT_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-actionlint-${{ env.ACTIONLINT_VERSION }}-

      - name: Run lint
        if: steps.ci-artifacts.outputs.coverage-available != '1'
        run: |
          set -o pipefail
          mkdir -p artifacts
          make lint 2>&1 | tee artifacts/make-lint.log
        env:
          GOBIN: ${{ env.GOBIN }}

      - name: Upload lint logs
        if: steps.ci-artifacts.outputs.coverage-available != '1'
        uses: actions/upload-artifact@v5
        with:
          name: lint-logs
          path: artifacts/make-lint.log

      - name: Run actionlint for release workflow
        if: steps.ci-artifacts.outputs.coverage-available != '1'
        run: |
          set -o pipefail
          mkdir -p artifacts
          make actionlint ACTIONLINT_PATHS=".github/workflows/release.yml" 2>&1 | tee artifacts/release-actionlint.log
        env:
          GOBIN: ${{ env.GOBIN }}

      - name: Upload actionlint logs
        if: steps.ci-artifacts.outputs.coverage-available != '1'
        uses: actions/upload-artifact@v5
        with:
          name: actionlint-logs-release
          path: artifacts/release-actionlint.log

      - name: Check Makefile formatting
        if: steps.ci-artifacts.outputs.coverage-available != '1'
        run: make lint-makefile

      - name: Run tests
        if: steps.ci-artifacts.outputs.coverage-available != '1'
        run: make test

      - name: Run coverage
        if: steps.ci-artifacts.outputs.coverage-available != '1'
        env:
          MIN_COVERAGE: "98"
          COVERAGE_PROFILE: coverage.out
          COVERAGE_SUMMARY: coverage.txt
          REUSE_INTEGRATION_COVERAGE: ${{ steps.ci-artifacts.outputs.integration-available || '0' }}
          INTEGRATION_COVERAGE_PROFILE: ${{ steps.ci-artifacts.outputs.integration-profile || '' }}
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          integration_available="${REUSE_INTEGRATION_COVERAGE:-0}"

          coverage_env=(
            "MIN_COVERAGE=$MIN_COVERAGE"
            "COVERAGE_PROFILE=$COVERAGE_PROFILE"
            "COVERAGE_SUMMARY=$COVERAGE_SUMMARY"
            "REUSE_INTEGRATION_COVERAGE=$integration_available"
          )

          if [ -n "${INTEGRATION_COVERAGE_PROFILE:-}" ]; then
            coverage_env+=("INTEGRATION_COVERAGE_PROFILE=$INTEGRATION_COVERAGE_PROFILE")
          fi

          env "${coverage_env[@]}" make coverage

      - name: Publish merged coverage summary
        if: success() && hashFiles('coverage.txt') != ''
        run: |
          { echo '### Coverage results'; echo; cat coverage.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage artifacts
        if: success() && hashFiles('coverage.out') != '' && hashFiles('coverage.txt') != ''
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt

  build-and-test-pr:
    name: Build & test (pull_request, no publish)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write

    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Restore Go build and module caches
        id: restore-go-cache
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run checks before container build
        env:
          CHECK_INCLUDE_CODEQL: "0"
        run: make check

      - name: Save Go build and module caches
        if: github.event.pull_request.head.repo.fork == false && steps.restore-go-cache.outputs.cache-hit != 'true' && github.ref_protected == true
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ steps.restore-go-cache.outputs.cache-primary-key }}

      - name: Compute build metadata
        id: build_meta
        run: |
          echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          commit_date=$(git show -s --format=%cI "${GITHUB_SHA}" || true)
          echo "build_date=${commit_date:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # For PRs we just build a local single-arch image and load it
      - name: Build rootless image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: rootless
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build,mode=max
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          tags: pr-local/${{ github.repository }}:${{ github.sha }}

      # basic container smoke test
      - name: Smoke test container
        run: |
          output=$(docker run --rm pr-local/${{ github.repository }}:${{ github.sha }} --version)

          expected=$(printf '{Version:%s GitCommit:%s BuildDate:%s}' \
            "${{ steps.build_meta.outputs.version }}" \
            "${{ github.sha }}" \
            "${{ steps.build_meta.outputs.build_date }}")

          if [[ "${output}" != "${expected}" ]]; then
            echo "version output mismatch"
            echo "  got:      ${output}"
            echo "  expected: ${expected}"
            exit 1
          fi

      # Trivy scan on PR (local image) + SARIF upload
      - name: Scan PR image with Trivy (SARIF)
        id: trivy_scan_pr
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: pr-local/${{ github.repository }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results-pr.sarif"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF (PR)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-pr.sarif
          category: trivy-pr-rootless

      - name: Fail PR if Trivy found CRITICAL/HIGH vulns
        if: steps.trivy_scan_pr.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL/HIGH vulnerabilities in PR image."
          exit 1

  build-and-test-merge-group:
    name: Build & test (merge_group, no publish)
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      security-events: write

    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Restore Go build and module caches
        id: restore-go-cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run checks before container build
        env:
          CHECK_INCLUDE_CODEQL: "0"
        run: make check

      - name: Save Go build and module caches
        if: steps.restore-go-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ steps.restore-go-cache.outputs.cache-primary-key }}

      - name: Compute build metadata
        id: build_meta
        run: |
          echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          commit_date=$(git show -s --format=%cI "${GITHUB_SHA}" || true)
          echo "build_date=${commit_date:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # For merge queue we just build a local single-arch image and load it
      - name: Build rootless image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: rootless
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-pr-build,mode=max
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          tags: pr-local/${{ github.repository }}:${{ github.sha }}

      # basic container smoke test
      - name: Smoke test container
        run: |
          output=$(docker run --rm pr-local/${{ github.repository }}:${{ github.sha }} --version)

          expected=$(printf '{Version:%s GitCommit:%s BuildDate:%s}' \
            "${{ steps.build_meta.outputs.version }}" \
            "${{ github.sha }}" \
            "${{ steps.build_meta.outputs.build_date }}")

          if [[ "${output}" != "${expected}" ]]; then
            echo "version output mismatch"
            echo "  got:      ${output}"
            echo "  expected: ${expected}"
            exit 1
          fi

      # Trivy scan on merge queue image (local image, no SARIF upload)
      - name: Scan merge queue image with Trivy
        id: trivy_scan_merge_group
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: pr-local/${{ github.repository }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results-merge-group.sarif"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Fail merge queue run if Trivy found CRITICAL/HIGH vulns
        if: steps.trivy_scan_merge_group.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL/HIGH vulnerabilities in merge queue image."
          exit 1

  # --------------------------------
  # Job 2: Release on v* tag (GHCR)
  # --------------------------------

  release:
    name: Release multi-arch images (tagged)
    runs-on: ubuntu-latest
    needs: verify-tag
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      actions: write # artifacts (upload)
      packages: write # GHCR push (release job)
      id-token: write # Cosign keyless (release job)
      security-events: write # Trivy SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For convenience, strip 'v' from tag if you ever need bare version
      - name: Extract version
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata
        id: build_meta
        run: |
          commit_date=$(git show -s --format=%cI "${GITHUB_SHA}" || true)
          echo "build_date=${commit_date:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}" >> "$GITHUB_OUTPUT"

      # ------ Metadata (tags + labels) with docker/metadata-action ------
      # Rootless is the primary image (gets :latest + semver tags)
      - name: Docker meta (rootless)
        id: meta_rootless
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag                               # v1.2.3
            type=ref,event=tag,suffix=-rootless              # v1.2.3-rootless
            type=semver,pattern={{version}}                  # 1.2.3
            type=semver,pattern={{version}},suffix=-rootless # 1.2.3-rootless
            type=semver,pattern={{major}}                    # 1
            type=semver,pattern={{major}},suffix=-rootless   # 1-rootless
            type=semver,pattern=v{{major}}                   # v1
            type=semver,pattern=v{{major}},suffix=-rootless  # v1-rootless
            type=raw,value=rootless                          # rootless
          flavor: |
            latest=true                                      # also tag :latest
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      # Rootful variant – tags prefixed with rootful-
      - name: Docker meta (rootful)
        id: meta_rootful
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag               # v1.2.3-rootful
            type=semver,pattern={{version}}  # 1.2.3-rootful
            type=semver,pattern={{major}}    # 1-rootful
            type=semver,pattern=v{{major}}   # v1-rootful
            type=raw,value=rootful,suffix=   # rootful
          flavor: |
            latest=false                     # auto by default; latest is for rootless only
            suffix=-rootful,onlatest=true    # add -rootful to each tag
          labels: |
            org.opencontainers.image.title=${{ github.repository }} (rootful)
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      # ------ Build & push rootless (multi-arch, with cache, SBOM, provenance) ------

      - name: Build and push rootless image (multi-arch)
        id: build_rootless
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: rootless
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_rootless.outputs.tags }}
          labels: ${{ steps.meta_rootless.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            IMAGE_SOURCE=${{ github.repositoryUrl }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-builder
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-builder,mode=max

      # ------ Build & push rootful (multi-arch) ------

      - name: Build and push rootful image (multi-arch)
        id: build_rootful
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: rootful
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_rootful.outputs.tags }}
          labels: ${{ steps.meta_rootful.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            IMAGE_SOURCE=${{ github.repositoryUrl }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-builder
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-builder,mode=max

      # ------ Cosign signing (keyless) ------
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0
        with:
          # Keep cosign pinned for predictable signing output; bump docs when upgrading.
          cosign-release: 'v3.0.2'

      - name: Sign rootless image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST="${{ steps.build_rootless.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

          echo "Signing ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"

      - name: Sign rootful image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST="${{ steps.build_rootful.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

          echo "Signing ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"

      # ------ Trivy image scan + SARIF upload (rootless tag) ------

      - name: Scan rootless image with Trivy (SARIF)
        id: trivy_scan_rootless
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: "sarif"
          output: "trivy-results-rootless.sarif"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1" # non-zero when CRITICAL/HIGH found

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-rootless.sarif
          category: trivy-rootless

      - name: Fail release if Trivy found CRITICAL/HIGH vulnerabilities
        if: steps.trivy_scan_rootless.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL/HIGH vulnerabilities in the rootless image."
          exit 1

      # ------ Explicit SBOM artifact (on top of SBOM attestation) ------

      - name: Generate SBOM (SPDX JSON) for rootless
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: "spdx-json"
