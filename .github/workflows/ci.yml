name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: "0.10.0"
  PYFLAKES_VERSION: "3.2.0"
  ACTIONLINT_VERSION: "v1.7.9"

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  merge_group:

jobs:
  agents:
    name: agents policy
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pyflakes-${{ env.PYFLAKES_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Verify AGENTS scopes
        run: make agents

  lint-tools:
    name: lint tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up lint tools
        uses: ./.github/actions/setup-lint-tools

  lint:
    name: golangci-lint
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOBIN: ${{ github.workspace }}/bin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Record golangci-lint version
        run: echo "GOLANGCI_LINT_VERSION=$(make -s print-golangci-lint-version)" >>"$GITHUB_ENV"

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Cache golangci-lint workspace
        uses: actions/cache@v4
        with:
          path: .cache/golangci
          key: ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mbake-1.4.3
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache golangci-lint binary
        uses: actions/cache@v4
        with:
          path: ${{ env.GOBIN }}/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Run golangci-lint
        run: make lint
        env:
          GOBIN: ${{ github.workspace }}/bin

      - name: Check Makefile formatting
        run: make lint-makefile

      - name: Ensure golangci-lint did not leave uncommitted fixes
        run: |
          if ! git diff --quiet; then
            echo "golangci-lint applied changes; commit the fixes before pushing." >&2
            git status --short >&2
            git diff >&2
            exit 1
          fi

  actionlint:
    name: actionlint (${{ matrix.workflow }})
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - lint-tools
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOBIN: ${{ github.workspace }}/bin
    strategy:
      matrix:
        workflow:
          - ci.yml
          - load.yml
          - release.yml
          - self-hosted.yml
          - go-dependency-submission.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Set up lint tools
        uses: ./.github/actions/setup-lint-tools

      - name: Run actionlint
        run: make actionlint ACTIONLINT_PATHS=".github/workflows/${{ matrix.workflow }}"

  govulncheck:
    name: govulncheck
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Cache govulncheck database
        uses: actions/cache@v4
        with:
          path: .cache/govulncheck
          key: ${{ runner.os }}-govulncheck-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-govulncheck-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run govulncheck
        run: make govulncheck

  unit-test:
    name: go test
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Run test suite
        run: make test

  build:
    name: go build
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Build all packages
        run: make build

  coverage:
    name: go test & coverage
    # Coverage suite normally completes in ~1-2m; cap at 5m to catch hangs.
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    needs:
      - unit-test
      - lint
      - govulncheck
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Download integration coverage (if available)
        id: download-integration-coverage
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: integration-coverage
          path: artifacts

      - name: Check integration coverage availability
        id: integration-coverage-availability
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          if [ "${{ steps.download-integration-coverage.outcome }}" = "success" ] && [ -f artifacts/integration-coverage.out ]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run coverage suite
        env:
          MIN_COVERAGE: "96"
          COVERAGE_PROFILE: coverage.out
          COVERAGE_SUMMARY: coverage.txt
          REUSE_INTEGRATION_COVERAGE: ${{ steps.integration-coverage-availability.outputs.available || '0' }}
          INTEGRATION_COVERAGE_PROFILE: artifacts/integration-coverage.out
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          integration_available="${REUSE_INTEGRATION_COVERAGE:-0}"

          coverage_env=(
            "MIN_COVERAGE=$MIN_COVERAGE"
            "COVERAGE_PROFILE=$COVERAGE_PROFILE"
            "COVERAGE_SUMMARY=$COVERAGE_SUMMARY"
            "REUSE_INTEGRATION_COVERAGE=$integration_available"
            "INTEGRATION_COVERAGE_PROFILE=$INTEGRATION_COVERAGE_PROFILE"
          )

          if [ "$integration_available" != "1" ]; then
            coverage_env+=("INTEGRATION_PKGS=")
          fi

          env "${coverage_env[@]}" make coverage

      - name: Publish coverage summary
        run: |
          {
            echo '### Coverage results';
            echo;
            cat coverage.txt;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error

  benchmarks:
    name: duty-cycle benchmarks
    # Benchmarks finish in under 2m in recent runs; allow 5m for headroom.
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      actions: write
    needs:
      - lint
      - unit-test
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Run duty-cycle benchmarks
        run: make bench

      - name: Upload benchmark log
        uses: actions/upload-artifact@v5
        with:
          name: duty-cycle-benchmarks
          path: artifacts/benchmarks/pool-bench.txt
          if-no-files-found: error

  container-smoke:
    name: container smoke
    # Container build/scan flow wraps in ~2; limit to 5m to prevent runaway builds.
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      actions: write
    needs:
      - lint
      - unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare build metadata
        id: build-meta
        run: |
          echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        env:
          RETRY_ATTEMPTS: "3"
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          attempt=1
          while [ "$attempt" -le "$RETRY_ATTEMPTS" ]; do
            echo "[build] attempt ${attempt}/${RETRY_ATTEMPTS}"
            if docker buildx build \
              --file Dockerfile \
              --platform linux/amd64 \
              --tag oci-cpu-shaper:test \
              --load \
              --cache-from type=gha,scope=ci-container-smoke \
              --cache-to type=gha,scope=ci-container-smoke,mode=max \
              --build-arg VERSION=dev \
              --build-arg GIT_COMMIT="${{ github.sha }}" \
              --build-arg BUILD_DATE="${{ steps.build-meta.outputs.build-date }}" \
              .; then
              echo "[build] succeeded on attempt ${attempt}"
              break
            fi

            if [ "$attempt" -eq "$RETRY_ATTEMPTS" ]; then
              echo "::error::docker buildx build failed after ${RETRY_ATTEMPTS} attempts"
              exit 1
            fi

            attempt=$((attempt + 1))
            backoff=$((attempt * 10))
            echo "[build] retrying in ${backoff}s"
            sleep "$backoff"
          done

      - name: Smoke test dry-run mode
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          docker run --rm oci-cpu-shaper:test \
            --mode dry-run \
            --log-level debug \
            --shutdown-after=4s 2>&1 | tee smoke.log

          grep -F '"controllerMode":"dry-run"' smoke.log
          grep -F '"offline":true' smoke.log
          grep -F '"message":"controller stopped"' smoke.log
          grep -F '"reason":"context deadline exceeded"' smoke.log
          rm smoke.log

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: oci-cpu-shaper:test
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        with:
          name: container-sbom
          path: sbom.spdx.json

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: oci-cpu-shaper:test
          fail-build: true
          severity-cutoff: critical

  integration:
    name: integration tests (cgroup v2)
    # Integration suite usually finishes within ~1-2m; cap at 5m for retries.
    timeout-minutes: 5
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Verify Docker cgroup version
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          version=$(docker info --format '{{.CgroupVersion}}')
          if [ "$version" != "2" ]; then
            echo "::error::integration suite requires cgroup v2 (detected ${version:-unknown})"
            exit 1
          fi

          echo "Cgroup version: $version"

      - name: Verify cgroup v2 cpu controller
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          controllers_path=/sys/fs/cgroup/cgroup.controllers
          if [ ! -r "$controllers_path" ]; then
            echo "::error::cgroup controllers file $controllers_path is not readable"
            exit 1
          fi

          controllers=$(tr '\n' ' ' < "$controllers_path")
          if ! grep -qw cpu "$controllers_path"; then
            echo "::error::integration suite requires the cgroup v2 cpu controller (controllers: ${controllers:-unknown})"
            exit 1
          fi

          echo "cgroup v2 controllers: $controllers"

      - name: Run integration tests
        env:
          INTEGRATION_KEEP_LOGS: "1"
          INTEGRATION_COVERAGE_PROFILE: artifacts/integration-coverage.out
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          make integration

      - name: Upload integration logs
        uses: actions/upload-artifact@v5
        with:
          name: integration-logs
          path: artifacts/integration.log
          if-no-files-found: error

      - name: Upload integration coverage
        uses: actions/upload-artifact@v5
        with:
          name: integration-coverage
          path: artifacts/integration-coverage.out
          if-no-files-found: error
