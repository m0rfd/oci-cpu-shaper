name: CI

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_type || (startsWith(github.ref, 'refs/tags/') && 'tag') || (github.ref && 'branch') || 'unknown' }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: "0.10.0"
  PYFLAKES_VERSION: "3.2.0"

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  merge_group:

jobs:
  agents:
    name: agents policy
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache
        with:
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml

      - name: Cache Python tools
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pyflakes-${{ env.PYFLAKES_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Verify AGENTS scopes
        run: make agents

  hook-template:
    name: pre-commit template hash
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify pre-commit hook checksum
        run: make verify-hook-template

      - name: Publish hook change reminder
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          base_ref="$BASE_SHA"
          if [ -z "$base_ref" ]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              base_ref="$(git rev-parse HEAD^)"
            else
              echo "No base commit available; skipping hook change summary." >&2
              exit 0
            fi
          fi

          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=50 origin "$BASE_REF" || true
          fi

          if ! git cat-file -e "$base_ref^{commit}" >/dev/null 2>&1; then
            echo "Base commit $base_ref not available; skipping hook change summary." >&2
            exit 0
          fi

          if git diff --name-only "$base_ref" HEAD -- hack/githooks/pre-commit hack/githooks/pre-commit.sha256 | grep -q .; then
            {
              echo "### Git hook template updated";
              echo;
              echo "- The tracked pre-commit hook hash changed. Run \`make install-git-hooks\` locally to refresh your hook.";
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  workflow-actionlint:
    name: workflow actionlint
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect workflow file changes
        id: detect-workflow-changes
        run: |
          set -euo pipefail

          base_ref="${{ github.event.pull_request.base.sha }}"
          head_ref="${{ github.event.pull_request.head.sha }}"

          if [ -z "$base_ref" ] || [ -z "$head_ref" ]; then
            echo "workflows-changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base_ref" "$head_ref" -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -q .; then
            echo "workflows-changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "workflows-changed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Run actionlint for workflows
        if: steps.detect-workflow-changes.outputs.workflows-changed == 'true'
        run: make actionlint ACTIONLINT_PATHS=".github/workflows/*.yml"

  check:
    name: make check
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # required for cache restore/save and artifact uploads
    runs-on: ubuntu-latest
    needs:
      - agents
      - integration
      - e2e
      - hook-template
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOBIN: ${{ github.workspace }}/bin
      CHECK_INCLUDE_CODEQL: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download integration coverage
        if: needs.integration.outputs.integration-succeeded == 'true'
        uses: actions/download-artifact@v5
        with:
          name: integration-coverage
          path: artifacts

      - name: Download e2e coverage
        if: needs.e2e.outputs.e2e-succeeded == 'true'
        uses: actions/download-artifact@v5
        with:
          name: e2e-coverage
          path: artifacts/e2e

      - name: Prepare integration coverage reuse
        run: |
          profile="artifacts/integration-coverage.out"
          if [ -f "$profile" ]; then
            echo "REUSE_INTEGRATION_COVERAGE=1" >>"$GITHUB_ENV"
            echo "INTEGRATION_COVERAGE_PROFILE=$profile" >>"$GITHUB_ENV"
          fi

      - name: Prepare e2e coverage reuse
        run: |
          profile="artifacts/e2e/coverage-e2e.out"
          if [ -f "$profile" ]; then
            echo "REUSE_E2E_COVERAGE=1" >>"$GITHUB_ENV"
            echo "E2E_COVERAGE_PROFILE=$profile" >>"$GITHUB_ENV"
          fi

      - name: Record golangci-lint version
        run: echo "GOLANGCI_LINT_VERSION=$(make -s print-golangci-lint-version)" >>"$GITHUB_ENV"

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Cache golangci-lint workspace
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: actions/cache@v4
        with:
          path: .cache/golangci
          key: ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache golangci-lint binary
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: actions/cache@v4
        with:
          path: ${{ env.GOBIN }}/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ steps.setup-go.outputs.go-version }}-

      - name: Run make check
        run: |
          set -o pipefail
          mkdir -p artifacts
          make check 2>&1 | tee artifacts/make-check.log

      - name: Publish coverage summaries
        if: success()
        run: |
          append_summary() {
            local title="$1" file="$2"
            if [ -f "$file" ]; then
              {
                echo "### ${title} coverage";
                echo;
                cat "$file";
                echo;
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          append_summary "Unit" "coverage-unit.txt"
          append_summary "Integration" "coverage-integration.txt"
          append_summary "E2E" "coverage-e2e.txt"
          append_summary "Merged" "coverage.txt"

      - name: Upload unit coverage artifacts
        if: success() && hashFiles('coverage-unit.out') != ''
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: |
            coverage-unit.out
            coverage-unit.txt
          if-no-files-found: error

      - name: Upload integration coverage artifacts
        if: success() && hashFiles('coverage-integration.out') != ''
        uses: actions/upload-artifact@v5
        with:
          name: integration-coverage-merged
          path: |
            coverage-integration.out
            coverage-integration.txt
          if-no-files-found: error

      - name: Upload e2e coverage artifacts
        if: success() && hashFiles('coverage-e2e.out') != ''
        uses: actions/upload-artifact@v5
        with:
          name: e2e-coverage-merged
          path: |
            coverage-e2e.out
            coverage-e2e.txt
          if-no-files-found: error

      - name: Upload merged coverage artifacts
        if: success() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error

      - name: Upload make check logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: make-check-logs
          path: artifacts/make-check.log

      - name: Ensure make check left no uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "make check applied changes; commit the fixes before pushing." >&2
            git status --short >&2
            git diff >&2
            exit 1
          fi

  govulncheck:
    name: govulncheck
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - check
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Cache govulncheck database
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: actions/cache@v4
        with:
          path: .cache/govulncheck
          key: ${{ runner.os }}-govulncheck-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-govulncheck-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run govulncheck
        run: make govulncheck

  benchmarks:
    name: duty-cycle benchmarks
    # Benchmarks finish in under 2m in recent runs; allow 5m for headroom.
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      actions: write # required for artifact uploads
    needs:
      - check
      - integration
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Run duty-cycle benchmarks
        run: make bench

      - name: Upload benchmark log
        uses: actions/upload-artifact@v5
        with:
          name: duty-cycle-benchmarks
          path: artifacts/benchmarks/pool-bench.txt
          if-no-files-found: error

  container-smoke:
    name: container smoke
    # Container build/scan flow wraps in ~2; limit to 5m to prevent runaway builds.
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false)
    permissions:
      contents: read
      actions: write # required for GHA cache and SBOM uploads
    needs:
      - check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare build metadata
        id: build-meta
        run: |
          echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        env:
          RETRY_ATTEMPTS: "3"
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          attempt=1
          while [ "$attempt" -le "$RETRY_ATTEMPTS" ]; do
            echo "[build] attempt ${attempt}/${RETRY_ATTEMPTS}"
            if docker buildx build \
              --file Dockerfile \
              --platform linux/amd64 \
              --tag oci-cpu-shaper:test \
              --load \
              --cache-from type=gha,scope=ci-container-smoke \
              --cache-to type=gha,scope=ci-container-smoke,mode=max \
              --build-arg VERSION=dev \
              --build-arg GIT_COMMIT="${{ github.sha }}" \
              --build-arg BUILD_DATE="${{ steps.build-meta.outputs.build-date }}" \
              .; then
              echo "[build] succeeded on attempt ${attempt}"
              break
            fi

            if [ "$attempt" -eq "$RETRY_ATTEMPTS" ]; then
              echo "::error::docker buildx build failed after ${RETRY_ATTEMPTS} attempts"
              exit 1
            fi

            attempt=$((attempt + 1))
            backoff=$((attempt * 10))
            echo "[build] retrying in ${backoff}s"
            sleep "$backoff"
          done

      - name: Smoke test dry-run mode
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          docker run --rm oci-cpu-shaper:test \
            --mode dry-run \
            --log-level debug \
            --shutdown-after=4s 2>&1 | tee smoke.log

          grep -F '"controllerMode":"dry-run"' smoke.log
          grep -F '"offline":true' smoke.log
          grep -F '"message":"controller stopped"' smoke.log
          grep -F '"reason":"context deadline exceeded"' smoke.log
          rm smoke.log

      - name: Trivy SBOM + vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: oci-cpu-shaper:test
          format: "spdx-json"
          output: "sbom.spdx.json"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1" # non-zero when CRITICAL/HIGH found

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        with:
          name: container-sbom
          path: sbom.spdx.json

  integration:
    name: integration tests (cgroup v2)
    # Integration suite usually finishes within ~1-2m; cap at 5m for retries.
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # required for artifact uploads
    needs:
      - agents
    runs-on: ubuntu-latest
    outputs:
      integration-succeeded: ${{ steps.integration-status.outputs.succeeded }}
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Verify Docker cgroup version
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          version=$(docker info --format '{{.CgroupVersion}}')
          if [ "$version" != "2" ]; then
            echo "::error::integration suite requires cgroup v2 (detected ${version:-unknown})"
            exit 1
          fi

          echo "Cgroup version: $version"

      - name: Verify cgroup v2 cpu controller
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          controllers_path=/sys/fs/cgroup/cgroup.controllers
          if [ ! -r "$controllers_path" ]; then
            echo "::error::cgroup controllers file $controllers_path is not readable"
            exit 1
          fi

          controllers=$(tr '\n' ' ' < "$controllers_path")
          if ! grep -qw cpu "$controllers_path"; then
            echo "::error::integration suite requires the cgroup v2 cpu controller (controllers: ${controllers:-unknown})"
            exit 1
          fi

          echo "cgroup v2 controllers: $controllers"

      - name: Run integration tests
        env:
          INTEGRATION_KEEP_LOGS: "1"
          INTEGRATION_COVERAGE_PROFILE: artifacts/integration-coverage.out
          RETRY_ATTEMPTS: "3"
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          attempt=1
          while [ "$attempt" -le "$RETRY_ATTEMPTS" ]; do
            echo "[integration] attempt ${attempt}/${RETRY_ATTEMPTS}"
            if make integration; then
              echo "[integration] succeeded on attempt ${attempt}"
              break
            fi

            if [ "$attempt" -eq "$RETRY_ATTEMPTS" ]; then
              echo "::error::integration suite failed after ${RETRY_ATTEMPTS} attempts"
              exit 1
            fi

            attempt=$((attempt + 1))
            backoff=$((attempt * 5))
            echo "[integration] retrying in ${backoff}s"
            sleep "$backoff"
          done

      - name: Summarize integration coverage
        if: success() && hashFiles('artifacts/integration-coverage.out') != ''
        run: |
          filtered_profile="artifacts/integration-coverage-filtered.out"
          { IFS= read -r mode_line || true; echo "$mode_line"; tail -n +2 artifacts/integration-coverage.out | grep -vE '_test\\.go:'; } > "$filtered_profile" < artifacts/integration-coverage.out
          go tool cover -func="$filtered_profile" | tee artifacts/integration-coverage.txt
          {
            echo '### Integration coverage';
            echo;
            cat artifacts/integration-coverage.txt;
            echo;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record integration status
        id: integration-status
        run: echo "succeeded=true" >> "$GITHUB_OUTPUT"

      - name: Upload integration logs
        uses: actions/upload-artifact@v5
        with:
          name: integration-logs
          path: artifacts/integration.log
          if-no-files-found: error

      - name: Upload integration coverage
        uses: actions/upload-artifact@v5
        with:
          name: integration-coverage
          path: |
            artifacts/integration-coverage.out
            artifacts/integration-coverage.txt
            artifacts/integration-coverage-filtered.out
          if-no-files-found: error

  e2e:
    name: tagged e2e suite
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    needs:
      - agents
    runs-on: ubuntu-latest
    outputs:
      e2e-succeeded: ${{ steps.e2e-status.outputs.succeeded }}
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOBIN: ${{ github.workspace }}/bin
      RUN_E2E_TESTS: "1"
      KEEP_E2E_COVERAGE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go with cache
        id: setup-go
        uses: ./.github/actions/setup-go-with-cache

      - name: Run make test with tagged e2e
        env:
          RETRY_ATTEMPTS: "2"
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e
          attempt=1
          while [ "$attempt" -le "$RETRY_ATTEMPTS" ]; do
            echo "[e2e] attempt ${attempt}/${RETRY_ATTEMPTS}"
            if make test 2>&1 | tee artifacts/e2e/make-test.log; then
              echo "[e2e] succeeded on attempt ${attempt}"
              break
            fi

            if [ "$attempt" -eq "$RETRY_ATTEMPTS" ]; then
              echo "::error::e2e suite failed after ${RETRY_ATTEMPTS} attempts"
              exit 1
            fi

            attempt=$((attempt + 1))
            backoff=$((attempt * 5))
            echo "[e2e] retrying in ${backoff}s"
            sleep "$backoff"
          done

      - name: Run coverage with e2e profile
        env:
          MIN_COVERAGE: "98"
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e
          make coverage 2>&1 | tee artifacts/e2e/make-coverage.log

      - name: Record e2e status
        id: e2e-status
        run: echo "succeeded=true" >> "$GITHUB_OUTPUT"

      - name: Publish coverage summaries
        if: success()
        run: |
          append_summary() {
            local title="$1" file="$2"
            if [ -f "$file" ]; then
              {
                echo "### ${title} coverage";
                echo;
                cat "$file";
                echo;
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          append_summary "Unit" "coverage-unit.txt"
          append_summary "Integration" "coverage-integration.txt"
          append_summary "E2E" "coverage-e2e.txt"
          append_summary "Merged" "coverage.txt"

      - name: Upload merged coverage artifacts
        if: success() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v5
        with:
          name: e2e-coverage
          path: |
            coverage.out
            coverage.txt
            coverage-unit.out
            coverage-unit.txt
            coverage-integration.out
            coverage-integration.txt
            coverage-e2e.out
            coverage-e2e.txt
          if-no-files-found: error

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: artifacts/e2e
          if-no-files-found: error
