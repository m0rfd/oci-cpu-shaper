# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [main, protected]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  merge_group:
  schedule:
    - cron: '44 19 * * 1'

jobs:
  analyze:
    name: Analyze (actions + go)
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Go with cache
      uses: ./.github/actions/setup-go-with-cache

    - name: Run CodeQL analyses via Makefile
      run: make codeql-all

    - name: Upload Go SARIF results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: artifacts/codeql/go.sarif

    - name: Upload GitHub Actions SARIF results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: artifacts/codeql/actions.sarif
