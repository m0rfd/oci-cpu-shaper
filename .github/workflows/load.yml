name: Load Test

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    name: worker pool load
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # required for artifact uploads
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Cache Go build and module downloads
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: actions/cache@v5
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ runner.os }}-load-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-load-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run worker pool load test
        run: go test -tags=load ./pkg/shape -run TestPoolLoad24hEquivalent -count=1 -v

      - name: Upload load test log
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: load-test-log
          path: artifacts/load/pool-24h.log
          retention-days: 7
          if-no-files-found: error
