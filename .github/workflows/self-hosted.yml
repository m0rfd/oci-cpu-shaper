name: Self-hosted Runner Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  validation:
    name: OCI self-hosted checks
    runs-on:
      - self-hosted
      - oci-free-tier
    timeout-minutes: 30
    env:
      OCI_CLI_AUTH: instance_principal
      GOCACHE: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect container engine (Docker or Podman)
        id: engine
        env:
          REQUESTED_ENGINE: ${{ env.CONTAINER_ENGINE || '' }}
        run: |
          set -euo pipefail

          # On rootless Podman with SELinux enforcing, bind mounts must carry :Z/:z labels
          # or the container runtime will deny access. Capture this upfront so later steps
          # can reuse the same engine selection logic.
          pick_engine() {
            if [ -n "$REQUESTED_ENGINE" ] && command -v "$REQUESTED_ENGINE" >/dev/null 2>&1; then
              echo "$REQUESTED_ENGINE"
              return 0
            fi

            if command -v podman >/dev/null 2>&1; then
              echo podman
              return 0
            fi

            if command -v docker >/dev/null 2>&1; then
              echo docker
              return 0
            fi

            echo "::error::Neither docker nor podman is available on the runner" >&2
            exit 1
          }

          engine_bin=$(pick_engine)
          echo "Using container engine: $engine_bin"
          echo "bin=$engine_bin" >>"$GITHUB_OUTPUT"

          echo "Container engine version output:" >&2
          "$engine_bin" version >&2 || true

          if [ "$engine_bin" = "podman" ]; then
            # Podman uses a different info schema than Docker; dump JSON for debugging.
            "$engine_bin" info --format '{{json .}}' | jq . >&2 || "$engine_bin" info >&2
          else
            "$engine_bin" info >&2
          fi

      - name: Collect IMDS metadata
        id: imds
        run: |
          set -euo pipefail

          header="Authorization: Bearer Oracle"
          base_url="http://169.254.169.254/opc/v2"

          instance_json=$(curl -sS -H "$header" "$base_url/instance/")
          region_json=$(echo "$instance_json" | jq -c '.regionInfo // {}')

          instance_id=$(echo "$instance_json" | jq -r '.id')
          compartment_id=$(echo "$instance_json" | jq -r '.compartmentId')
          canonical_region=$(echo "$instance_json" | jq -r '.canonicalRegionName // ""')
          fallback_region=$(echo "$region_json" | jq -r '.regionIdentifier // ""')

          if [ -z "$instance_id" ] || [ "$instance_id" = "null" ]; then
            echo "::error::IMDS instance payload did not contain an id"
            exit 1
          fi

          if [ -z "$compartment_id" ] || [ "$compartment_id" = "null" ]; then
            echo "::error::IMDS instance payload did not contain a compartmentId"
            exit 1
          fi

          region="$canonical_region"
          if [ -z "$region" ] || [ "$region" = "null" ]; then
            region="$fallback_region"
          fi

          if [ -z "$region" ] || [ "$region" = "null" ]; then
            echo "::error::Unable to determine region from IMDS"
            exit 1
          fi

          {
            echo "instance-ocid=$instance_id"
            echo "compartment-ocid=$compartment_id"
            echo "region=$region"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build and module downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/go
            .cache/gomod
          key: ${{ runner.os }}-self-hosted-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-self-hosted-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Verify Always Free guardrail alarm
        env:
          INSTANCE_OCID: ${{ steps.imds.outputs.instance-ocid }}
          COMPARTMENT_OCID: ${{ steps.imds.outputs.compartment-ocid }}
          OCI_REGION: ${{ steps.imds.outputs.region }}
          METRIC_COMPARTMENT_OCID: ${{ vars.SELF_HOSTED_METRIC_COMPARTMENT_OCID || '' }}
          SKIP_GUARD: ${{ vars.SELF_HOSTED_SKIP_ALARM_GUARD || 'false' }}
          REQUIRE_DESTINATIONS: ${{ vars.SELF_HOSTED_REQUIRE_ALARM_DESTINATIONS || 'true' }}
          EXPECTED_PENDING: ${{ vars.SELF_HOSTED_EXPECTED_PENDING_DURATION || 'PT1H' }}
          EXPECTED_RESOLUTION: ${{ vars.SELF_HOSTED_EXPECTED_RESOLUTION || '1d' }}
        run: |
          set -euo pipefail

          if [ "${SKIP_GUARD,,}" = "true" ]; then
            echo "Skipping Always Free guardrail verification"
            exit 0
          fi

          if [ -z "$INSTANCE_OCID" ] || [ -z "$COMPARTMENT_OCID" ]; then
            echo "::error::Missing instance or compartment identifiers for guardrail validation"
            exit 1
          fi

          args=(
            -instance "$INSTANCE_OCID"
            -compartment "$COMPARTMENT_OCID"
            -region "$OCI_REGION"
            -timeout 60s
            -expected-pending "$EXPECTED_PENDING"
            -expected-resolution "$EXPECTED_RESOLUTION"
          )

          if [ -n "$METRIC_COMPARTMENT_OCID" ]; then
            args+=( -metric-compartment "$METRIC_COMPARTMENT_OCID" )
          fi

          if [ "${REQUIRE_DESTINATIONS,,}" != "true" ]; then
            args+=( -require-destinations=false )
          fi

          go run ./hack/tools/alarmguard "${args[@]}"

      - name: Query Monitoring for P95 CPU
        env:
          INSTANCE_OCID: ${{ steps.imds.outputs.instance-ocid }}
          COMPARTMENT_OCID: ${{ steps.imds.outputs.compartment-ocid }}
          OCI_REGION: ${{ steps.imds.outputs.region }}
          ALLOW_EMPTY: ${{ vars.SELF_HOSTED_ALLOW_EMPTY_METRICS || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "$INSTANCE_OCID" ] || [ -z "$COMPARTMENT_OCID" ]; then
            echo "::error::Missing instance or compartment identifiers"
            exit 1
          fi

          args=(
            -instance "$INSTANCE_OCID"
            -compartment "$COMPARTMENT_OCID"
            -region "$OCI_REGION"
            -timeout 45s
          )

          if [ "$ALLOW_EMPTY" = "true" ]; then
            args+=( -allow-empty )
          fi

          go run ./hack/tools/p95query "${args[@]}"

      - name: Validate container cgroup v2 behaviour
        env:
          CONTAINER_BIN: ${{ steps.engine.outputs.bin }}
        run: |
          set -euo pipefail

          engine_bin=${CONTAINER_BIN:-docker}

          # Podman reports cgroup versions as "v2" while Docker reports "2".
          version=$("$engine_bin" info --format '{{.CgroupVersion}}' 2>/dev/null || true)
          if [ -z "$version" ] && [ "$engine_bin" = "podman" ]; then
            version=$("$engine_bin" info --format '{{.Host.CgroupVersion}}')
          fi

          normalized_version=${version#v}
          echo "Detected cgroup version (${engine_bin}): $version (normalized=$normalized_version)"
          if [ "$normalized_version" != "2" ]; then
            echo "::error::Expected container runtime to use cgroup v2"
            "$engine_bin" info >&2 || true
            exit 1
          fi

          "$engine_bin" pull --quiet alpine:3.20
          "$engine_bin" run --rm alpine:3.20 sh -c 'cat /sys/fs/cgroup/cgroup.controllers'
          "$engine_bin" run --rm --cpus=0.5 alpine:3.20 sh -c "echo cpu.max=\$(cat /sys/fs/cgroup/cpu.max) cpu.weight=\$(cat /sys/fs/cgroup/cpu.weight)"

      - name: Build rootful integration image
        env:
          CONTAINER_BIN: ${{ steps.engine.outputs.bin }}
        run: |
          set -euo pipefail

          engine_bin=${CONTAINER_BIN:-docker}

          "$engine_bin" build \
            --target rootful \
            --load \
            -t oci-cpu-shaper:integration-rootful \
            -f Dockerfile \
            .

      - name: Exercise CPU weight containers and collect cgroup stats
        env:
          LOG_ROOT: ${{ github.workspace }}/artifacts/self-hosted-cgroup
          CONTAINER_BIN: ${{ steps.engine.outputs.bin }}
        run: |
          set -euo pipefail

          host_arch=$(uname -m)
          echo "Runner architecture: $host_arch"

          engine_bin=${CONTAINER_BIN:-docker}

          if "$engine_bin" image inspect oci-cpu-shaper:integration-rootful >/dev/null 2>&1; then
            "$engine_bin" image inspect --format 'arch={{.Architecture}} os={{.Os}}' oci-cpu-shaper:integration-rootful || true
          else
            echo "Rootful integration image missing; it should be built in the previous step."
          fi

          mkdir -p "$LOG_ROOT"
          run_dir="$LOG_ROOT/run-$(date --utc +%Y%m%dT%H%M%SZ)"
          mkdir -p "$run_dir"

          hog_binary="$run_dir/cpu-hog"
          high_name=""
          low_name=""

          cleanup() {
            status=$?
            set +e
            for name in "$high_name" "$low_name"; do
              if [ -n "$name" ]; then
                "$engine_bin" logs "$name" >"$run_dir/${name}.log" 2>&1 || true
                "$engine_bin" rm -f "$name" >/dev/null 2>&1 || true
              fi
            done
            rm -f "$hog_binary"
            exit $status
          }
          trap cleanup EXIT

          echo "Building cpu-hog helper"
          case "$host_arch" in
            x86_64) go_arch=amd64 ;;
            arm64|aarch64) go_arch=arm64 ;;
            *) go_arch="$host_arch" ;;
          esac
          CGO_ENABLED=0 GOOS=linux GOARCH="$go_arch" go build -o "$hog_binary" ./tests/integration/cmd/cpu-hog

          high_name="cpu-weight-high-$(date +%s%N)"
          low_name="cpu-weight-low-$(date +%s%N)"

          echo "Launching high weight container: $high_name"
          # SELinux on rootless Podman requires :Z/ :z on bind mounts. Use :ro,Z to avoid
          # unexpected label denials while keeping the mount read-only for Docker users.
          "$engine_bin" run \
            --detach \
            --name "$high_name" \
            --cpuset-cpus=0 \
            --cpu-shares 1024 \
            -v "$hog_binary:/hog:ro,Z" \
            --entrypoint /hog \
            alpine:3.20 \
            -duration=40s \
            -workers=1

          echo "Launching low weight container: $low_name"
          "$engine_bin" run \
            --detach \
            --name "$low_name" \
            --cpuset-cpus=0 \
            --cpu-shares 2 \
            -v "$hog_binary:/hog:ro,Z" \
            --entrypoint /hog \
            oci-cpu-shaper:integration-rootful \
            -duration=40s \
            -workers=1

          wait_for_running() {
            local name=$1
            local deadline=$((SECONDS + 45))
            while [ $SECONDS -lt $deadline ]; do
              if [ "$("$engine_bin" inspect -f '{{.State.Running}}' "$name" 2>/dev/null || echo false)" = "true" ]; then
                return 0
              fi
              sleep 1
            done
            echo "::error::container $name did not reach running state" >&2
            "$engine_bin" ps -a >&2 || true
            return 1
          }

          wait_for_running "$high_name"
          wait_for_running "$low_name"

          echo "Allowing workloads to warm up before sampling CPU usage"
          sleep 20

          clk_tck=$(getconf CLK_TCK)
          observation_window=10

          ensure_running() {
            local name=$1
            if [ "$("$engine_bin" inspect -f '{{.State.Running}}' "$name" 2>/dev/null || echo false)" != "true" ]; then
              echo "::error::container $name is not running" >&2
              "$engine_bin" inspect "$name" >&2 || true
              return 1
            fi
          }

          resolve_pid() {
            local name=$1
            local pid
            pid=$("$engine_bin" inspect -f '{{.State.Pid}}' "$name" 2>/dev/null || echo 0)
            if [ -z "$pid" ] || [ "$pid" -le 0 ]; then
              echo "::error::unable to resolve pid for $name" >&2
              return 1
            fi
            echo "$pid"
          }

          read_ticks() {
            local pid=$1
            if [ ! -r "/proc/$pid/stat" ]; then
              echo "::error::/proc/$pid/stat is not readable" >&2
              return 1
            fi
            awk '{print $14 + $15}' "/proc/$pid/stat"
          }

          record_host_config() {
            local name=$1
            local dest=$2
            "$engine_bin" inspect "$name" >"$dest" 2>/dev/null || true
          }

          ensure_running "$high_name"
          ensure_running "$low_name"

          high_pid=$(resolve_pid "$high_name")
          low_pid=$(resolve_pid "$low_name")

          record_host_config "$high_name" "$run_dir/${high_name}-inspect.json"
          record_host_config "$low_name" "$run_dir/${low_name}-inspect.json"

          read_container_shares() {
            local name=$1
            "$engine_bin" inspect -f '{{.HostConfig.CPUShares}}' "$name" 2>/dev/null || echo 0
          }

          high_shares=$(read_container_shares "$high_name")
          low_shares=$(read_container_shares "$low_name")

          echo "High weight shares: $high_shares" | tee "$run_dir/${high_name}-shares.txt"
          echo "Low weight shares: $low_shares" | tee "$run_dir/${low_name}-shares.txt"

          if [ -z "$high_shares" ] || [ -z "$low_shares" ] || [ "$high_shares" -le 0 ] || [ "$low_shares" -le 0 ]; then
            echo "::error::missing CPU share settings from container inspect" >&2
            exit 1
          fi

          if [ "$high_shares" -le "$low_shares" ]; then
            echo "::error::expected high weight container shares to exceed low weight" >&2
            exit 1
          fi

          start_high_ticks=$(read_ticks "$high_pid")
          start_low_ticks=$(read_ticks "$low_pid")

          echo "Sampling CPU usage for ${observation_window}s"
          sleep "$observation_window"

          ensure_running "$high_name"
          ensure_running "$low_name"

          end_high_ticks=$(read_ticks "$high_pid")
          end_low_ticks=$(read_ticks "$low_pid")

          if [ -z "$start_high_ticks" ] || [ -z "$start_low_ticks" ] || [ -z "$end_high_ticks" ] || [ -z "$end_low_ticks" ]; then
            echo "::error::incomplete CPU samples" >&2
            exit 1
          fi

          high_delta=$((end_high_ticks - start_high_ticks))
          low_delta=$((end_low_ticks - start_low_ticks))

          if [ "$high_delta" -le 0 ] || [ "$low_delta" -le 0 ]; then
            echo "::error::CPU samples did not advance as expected" >&2
            exit 1
          fi

          high_usage_us=$((high_delta * 1000000 / clk_tck))
          low_usage_us=$((low_delta * 1000000 / clk_tck))

          echo "High weight usage (µs): $high_usage_us (shares=$high_shares)" | tee "$run_dir/${high_name}-summary.txt"
          echo "Low weight usage (µs): $low_usage_us (shares=$low_shares)" | tee "$run_dir/${low_name}-summary.txt"

          python_script=$'import decimal\n'
          python_script+=$'import sys\n\n'
          python_script+=$'high = decimal.Decimal(sys.argv[1])\n'
          python_script+=$'low = decimal.Decimal(sys.argv[2])\n'
          python_script+=$'ratio = high / low\n\n'
          python_script+=$'if ratio < decimal.Decimal("3.0"):\n'
          python_script+=$'    sys.stderr.write("::error::expected high weight container to receive at least 3.0x CPU time (got {:.2f}x)\\n".format(ratio))\n'
          python_script+=$'    sys.exit(1)\n\n'
          python_script+=$'print(ratio.quantize(decimal.Decimal("0.01")))\n'
          ratio=$(python -c "$python_script" "$high_usage_us" "$low_usage_us")
          echo "Observed CPU usage ratio (high/low): $ratio" | tee "$run_dir/ratio.txt"
          echo "CPU weight responsiveness verified from host-level stats"

      - name: Upload self-hosted cgroup artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: self-hosted-cgroup-data
          path: artifacts/self-hosted-cgroup
          retention-days: 7
