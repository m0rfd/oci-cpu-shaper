# Example Mode A configuration tuned for production guardrails.
controller:
  targetStart: 0.25
  targetMin: 0.22
  targetMax: 0.40
  stepUp: 0.02
  stepDown: 0.01
  fallbackTarget: 0.25
  goalLow: 0.23
  goalHigh: 0.30
  interval: 1h
  relaxedInterval: 6h
  relaxedThreshold: 0.28
  suppressThreshold: 0.85
  suppressResume: 0.70
estimator:
  interval: 1s
pool:
  quantum: 1ms
  pauseThreshold: 0.85
  resumeThreshold: 0.70
http:
  bind: ":9108"
oci:
  offline: false
