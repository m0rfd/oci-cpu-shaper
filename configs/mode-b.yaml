# Example Mode B configuration tuned for production guardrails.
controller:
  targetStart: 0.22
  targetMin: 0.20
  targetMax: 0.32
  stepUp: 0.01
  stepDown: 0.005
  fallbackTarget: 0.22
  goalLow: 0.21
  goalHigh: 0.27
  interval: 1h
  relaxedInterval: 4h
  relaxedThreshold: 0.26
  relaxedConfirmations: 2
  suppressThreshold: 0.80
  suppressResume: 0.68
  suppressRunnableThreshold: 1.20
  suppressRunnableResume: 0.96
  suppressSmoothingSamples: 5
estimator:
  interval: 1s
pool:
  workers: 2
  quantum: 1ms
  pauseThreshold: 0.80
  resumeThreshold: 0.68
  runnableGuard: 1.20
http:
  bind: ":9108"
oci:
  offline: false
